# Supabase local (npx supabase start): usado pelo teste das telas de ponta a ponta (e2e/) e para rodar o Vitral
# no seu computador. As migrações em supabase/migrations entram sozinhas no start. Não vale para produção.
project_id = "vitral-lens"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false

# login por e-mail ligado (o "enable_signup" daqui liga o provedor de e-mail; com false, ninguém entra).
# O cadastro aberto continua fechado pelo [auth] enable_signup = false: quem cria login é o dono ou o painel.
[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
