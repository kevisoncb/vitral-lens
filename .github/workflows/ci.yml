name: CI

on:
  push:
  pull_request:

jobs:
  banco:
    name: Banco de dados (migração e permissões)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # mesma versão do Supabase
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar o schema
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/stub_supabase.sql
          for m in supabase/migrations/0*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$m"; done
      - name: Teste de permissões
        run: |
          psql -q -f supabase/tests/rls_smoke.sql 2>&1 | tee saida.txt
          # Cada linha abaixo prova um bloqueio ou uma regra do banco
          grep -q "new row violates row-level security policy" saida.txt
          grep -q "Informe o motivo da perda" saida.txt
          grep -q "consulta_sem_conflito" saida.txt
          grep -q "lab criou OS direto (esperado numeros 1,2) | 1,2" saida.txt
          grep -q "entregue | t *| t" saida.txt
      - name: Teste de pagamento (sinal, saldo e OS automática)
        run: |
          psql -q -f supabase/tests/pagamento_smoke.sql 2>&1 | tee pagamento.txt
          grep -q "total recalculado (esperado 1361.00) *| *1361.00" pagamento.txt
          grep -q "qtd OS (esperado 1) *| *1" pagamento.txt
          grep -q "pago (esperado 1361.00) *| *1361.00" pagamento.txt
          grep -q "Informe um valor maior que zero" pagamento.txt
          grep -q "Sem permissão" pagamento.txt
      - name: Teste do site público (orçamento, agendamento online, Sem retorno, proteções)
        run: |
          psql -q -f supabase/tests/site_smoke.sql 2>&1 | tee site.txt
          grep -q "anon nao le clientes" site.txt || grep -q "permission denied for table clientes" site.txt
          grep -q "vagas amanha (esperado 3) *| *3" site.txt
          grep -q "vagas depois (esperado 2) *| *2" site.txt
          grep -q "Esse horário não está mais disponível" site.txt
          grep -q "Recebemos muitos pedidos agora" site.txt
          grep -q "cards do site (esperado 3) *| *3" site.txt
          grep -q "sem retorno movidos (esperado 3) *| *3" site.txt
          grep -q "permission denied for function mover_sem_retorno" site.txt
          grep -q "O perfil Dono sempre tem acesso total" site.txt
          grep -q "A ótica precisa de pelo menos um Dono ativo" site.txt
          grep -q "otica apagada em cascata *| *t" site.txt
      - name: Teste do fluxo unificado (exame, receita, OS com ficha técnica, produção)
        run: |
          psql -q -f supabase/tests/consultorio_smoke.sql 2>&1 | tee fluxo.txt
          grep -q "receita com 2 olhos e medico | Dra. Carla | CBOO 123 | *2" fluxo.txt
          grep -q "Exame concluído não pode ser alterado" fluxo.txt
          grep -q "ficha tecnica | Multifocal 1.67 | Antirreflexo | Armação metal | *31.5 | *32.0 | *19.0 | t" fluxo.txt
          grep -q "lab nao ve exame (esperado 0) | *0" fluxo.txt
          grep -q "producao | *3 | t *| Eixo fora" fluxo.txt
      - name: Teste das áreas e da conversa entre os cards
        run: |
          psql -q -f supabase/tests/areas_smoke.sql 2>&1 | tee areas.txt
          grep -q "card do consultorio | consultorio | t" areas.txt
          grep -q "Esta etapa é movida pela equipe do laboratório" areas.txt
          grep -q "Esta etapa é movida pela equipe da loja" areas.txt
          grep -q "lab ve clientes (esperado 0) | *0" areas.txt
          grep -q "puxada pelo lab | Lab" areas.txt
          grep -q "balcao le recado | laboratorio" areas.txt
          grep -q "nota fiscal sem adicional (esperado f) | f" areas.txt
          grep -q "Para abrir outra, contrate o adicional" areas.txt
          grep -q "lojas com adicional (esperado 2) | *2" areas.txt
          grep -q "preco intacto | 450.00" areas.txt
          grep -q "balcao poe primeira foto | t" areas.txt
          grep -q "Seu perfil não pode trocar a foto" areas.txt
      - name: Teste da Versão 2 (importação de planilhas, lista de espera do Vitral)
        run: |
          psql -q -f supabase/tests/versao2_smoke.sql 2>&1 | tee versao2.txt
          grep -q '"inseridos": 2, "repetidos": 2' versao2.txt
          grep -q '"linha": 6, "motivo": "CPF com 3 números"' versao2.txt
          grep -q "clientes depois (esperado 3) *| *3" versao2.txt
          grep -q "produtos depois (esperado 2) *| *2" versao2.txt
          grep -q "vizinha ve so os seus (esperado 1) *| *1" versao2.txt
          grep -q "Seu perfil não pode cadastrar clientes" versao2.txt
          grep -q "É preciso aceitar o uso dos dados para entrar na lista" versao2.txt
          grep -q "permission denied for function importar_clientes" versao2.txt
          grep -q "inscritos (esperado 1) *| *1 | ES" versao2.txt
      - name: Teste da Versão 3 (estoque e comissões)
        run: |
          psql -q -f supabase/tests/versao3_smoke.sql 2>&1 | tee versao3.txt
          grep -q "controla estoque | armacao=true,lente=false" versao3.txt
          grep -q "perda (esperado 3) *| *3" versao3.txt
          grep -q "saldos por loja | Bairro=1,Centro=2" versao3.txt
          grep -q "permission denied for table estoque_movimentos" versao3.txt
          grep -q "Informe o motivo da saída" versao3.txt
          grep -q "Seu perfil não pode dar entrada no estoque" versao3.txt
          grep -q 'new row violates row-level security policy for table "comissao_regras"' versao3.txt
          grep -q "vitor ve so a dele (esperado 1) | *1 | 40.00" versao3.txt
          grep -q "baixa uma vez por venda (esperado Centro=0) | Bairro=1,Centro=0" versao3.txt
          grep -q "comissoes | Vera=47.00/700.00,Vitor=40.00/400.00" versao3.txt
          grep -q "Seu perfil não pode pagar comissões" versao3.txt
          grep -q "dono ve todas e paga (esperado 2) | *2" versao3.txt
          grep -q "lab nao ve estoque nem comissoes (esperado 0 0) | *0 | *0" versao3.txt
          grep -q "codigos | Armação Teste=2000000002,Cordão=2000000001,Lente Teste=2000000003" versao3.txt
          grep -q "Seu perfil não pode alterar o catálogo" versao3.txt
      - name: Teste da Versão 4 (PDV e financeiro)
        run: |
          psql -q -f supabase/tests/versao4_smoke.sql 2>&1 | tee versao4.txt
          grep -q "O PDV e o caixa fazem parte do Plano Especial" versao4.txt
          grep -q "caixas sem plano (esperado 0) | *0" versao4.txt
          grep -q "fecha sem plano | t" versao4.txt
          grep -q "areas v4 | caixa=pdv,contador=financeiro,financeiro=financeiro" versao4.txt
          grep -q "abre caixa | t" versao4.txt
          grep -q "Desconto acima de 10% precisa do gerente" versao4.txt
          grep -q "não fecham com o total da venda" versao4.txt
          grep -q "Crediário precisa do cliente identificado" versao4.txt
          grep -q "permission denied for table vendas" versao4.txt
          grep -q "Só o gerente cancela venda" versao4.txt
          grep -q "vendas do caixa | 1=380.00,2=50.00" versao4.txt
          grep -q "estoque apos vendas (esperado estojo 7, sol 2) | Estojo=7,Óculos de sol=2" versao4.txt
          grep -q "comissao pdv (5% de 380) | 2.50,19.00" versao4.txt
          grep -q "conta a receber do crediario | 50.00 | 2030-01-10" versao4.txt
          grep -q "estoque apos cancelar (esperado estojo 9, sol 3) | Estojo=9,Óculos de sol=3" versao4.txt
          grep -q "comissoes apos cancelar | aberta,cancelada" versao4.txt
          grep -q '"esperado": 50.00, "diferenca": -5.00' versao4.txt
          grep -q "caixa nao ve contas a pagar (esperado 0) | *0" versao4.txt
          grep -q "contador le | *1 | 2030-11-19" versao4.txt
          grep -q 'new row violates row-level security policy for table "contas_pagar"' versao4.txt
          grep -q "valor intacto | 320.00" versao4.txt
          grep -q "horario sem otica_id (esperado 1) | *1" versao4.txt
      - name: Teste do painel do Vitral
        run: |
          psql -q -f supabase/tests/painel_smoke.sql 2>&1 | tee painel.txt
          grep -q "dono e admin? (esperado f) | f" painel.txt
          grep -q "Só a equipe do Vitral acessa o painel" painel.txt
          grep -q "criou | t" painel.txt
          grep -q "Esse endereço de site já é de outra ótica" painel.txt
          grep -q "Esse login já pertence a uma ótica" painel.txt
          grep -q 'painel | Ótica Nova | suspensa | *1 | *1 | {"multiloja": 2} | nova@otica.com' painel.txt
          grep -q "Ótica não encontrada" painel.txt
          grep -q "dona da nova (suspensa) ve a otica? (esperado 0) | *0" painel.txt
      - name: Teste da entrada de mercadoria pelo XML da NF-e
        run: |
          psql -q -f supabase/tests/nfe_smoke.sql 2>&1 | tee nfe.txt
          grep -q '"contas": 3, "unidades": 15, "produtos_novos": 2' nfe.txt
          grep -q "estoque | Armação acetato preta=3@150.00, Lente de contato mensal=10@62.50, Óculos sol aviador=2@89.90" nfe.txt
          grep -q "contas | *3 | 1254.80 | NF 8812 (1/3)" nfe.txt
          grep -q "Esta nota já foi lançada em" nfe.txt
          grep -q 'Quantidade inválida em "Novo com erro"' nfe.txt
          grep -q "notas lancadas (esperado 1) | *1" nfe.txt
          grep -q "Seu perfil não pode dar entrada no estoque" nfe.txt
          grep -q "A entrada pela nota do fornecedor faz parte do Plano Especial" nfe.txt
          grep -q "Armação acetato preta ncm=90031900 cest=2805400 orig=0 un=UN final=166.25" nfe.txt
          grep -q "Óculos sol aviador ncm=90041000 cest=- orig=2 un=UN final=91.20" nfe.txt
          grep -q "custo do movimento | 62.50,91.20,166.25" nfe.txt
          grep -q "margem e preco | Armação acetato preta m=30.00 p=216.13 reais/porcentagem | Lente de contato mensal m=- p=0.00 reais/reais fora da venda" nfe.txt
      - name: Teste da emissão de NFC-e (preparação, retorno e cancelamento)
        run: |
          psql -q -f supabase/tests/nfce_smoke.sql 2>&1 | tee nfce.txt
          grep -q "A emissão de nota fiscal não está ativa para esta ótica" nfce.txt
          grep -q "A emissão ainda não foi configurada para esta ótica" nfce.txt
          grep -q "Só a equipe do Vitral acessa o painel" nfce.txt
          grep -q "Complete NCM, origem e CSOSN no cadastro de: Estojo" nfce.txt
          grep -q "preparada | homologacao | tok-h | 12345678000190 | 12345678901" nfce.txt
          grep -q "itens | 1:90031100/102/300.00-7.50 2:42029200/102/100.00-2.50" nfce.txt
          grep -q "desconto rateado | 10.00" nfce.txt
          grep -q "pagamentos | 03=200.00/integ2 17=190.00" nfce.txt
          grep -q "retoma a mesma | t" nfce.txt
          grep -q "notas da venda (esperado 1) | *1" nfce.txt
          grep -q "Esta venda já tem nota fiscal" nfce.txt
          grep -q "Só o gerente cancela nota fiscal" nfce.txt
          grep -q "A justificativa precisa ter de 15 a 255 letras" nfce.txt
          grep -q "nota depois | cancelada | Cliente desistiu da compra na hora" nfce.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Teste de clientes para chamar
        run: |
          psql -q -f supabase/tests/chamar_smoke.sql 2>&1 | tee chamar.txt
          grep -q "lista | Bruno Aniversário:aniversario:faz aniversário em 03/03 | Ana Receita:receita_vencendo:receita vence em 10/03/2027 | Davi Óculos:oculos_um_ano:recebeu os óculos em 05/03/2026 | Elisa Perdido:orcamento_perdido:orçamento perdido em 15/01/2027" chamar.txt
          grep -q "bissexto | Carla Bissexto:faz aniversário em 28/02" chamar.txt
          grep -q "depois de chamar a Ana | Bruno Aniversário,Davi Óculos,Elisa Perdido" chamar.txt
          grep -q "permission denied for table cliente_contatos" chamar.txt
          grep -q "contatos (esperado 1) | *1" chamar.txt
          grep -q 'new row violates row-level security policy for table "cliente_contatos"' chamar.txt
          grep -q "outra otica | Iara Outra Ótica:aniversario" chamar.txt
          grep -q "laboratorio (esperado 0) | *0" chamar.txt
          grep -q "permission denied for function clientes_para_chamar" chamar.txt
      - name: Teste da LGPD do cliente (registro de acesso, exportar, anonimizar)
        run: |
          psql -q -f supabase/tests/lgpd_smoke.sql 2>&1 | tee lgpd.txt
          grep -q "balcao ve registro (esperado 0) | *0" lgpd.txt
          grep -q "Só o dono ou o gerente exporta os dados do cliente" lgpd.txt
          grep -q "Só o dono ou o gerente anonimiza um cliente" lgpd.txt
          grep -q "Cliente não encontrado" lgpd.txt
          grep -q "exportar | Maria da Silva | *1 | *1 | t *| f" lgpd.txt
          grep -q "Digite o nome do cliente exatamente como está para confirmar" lgpd.txt
          grep -q "cliente | Cliente anonimizado | *| *| *| *| *| t" lgpd.txt
          grep -q "receita fica | *1 | Dr. João" lgpd.txt
          grep -q "anotacoes (esperado 0) | *0" lgpd.txt
          grep -q "Este cliente já foi anonimizado" lgpd.txt
          grep -q "registro | viu_receita,exportou,anonimizou" lgpd.txt
          grep -q "permission denied for table acessos_dados_cliente" lgpd.txt
          grep -q "auditoria sem dados pessoais | *0 | *3" lgpd.txt
      - name: Teste da assinatura da OS pelo link
        run: |
          psql -q -f supabase/tests/assinatura_smoke.sql 2>&1 | tee assinatura.txt
          grep -q "mesmo link | t" assinatura.txt
          grep -q "Seu perfil não pode pedir a assinatura do cliente" assinatura.txt
          grep -q "lab ve assinaturas (esperado 0) | *0" assinatura.txt
          grep -q "resumo | pendente | Rosa Lima | 940.00 | 400.00 | *2 | *2" assinatura.txt
          grep -q "token errado | t" assinatura.txt
          grep -q "permission denied for table os_assinaturas" assinatura.txt
          grep -q "permission denied for function gerar_link_assinatura" assinatura.txt
          grep -q "Faça a sua assinatura no quadro." assinatura.txt
          grep -q "Escreva seu nome completo." assinatura.txt
          grep -q "depois | assinada | Rosa Lima" assinatura.txt
          grep -q "Esta OS já foi assinada." assinatura.txt
          grep -q "recado na OS | Cliente conferiu e assinou a OS pelo link (Rosa Lima)." assinatura.txt
          grep -q "Esta OS já foi assinada pelo cliente" assinatura.txt
          grep -q "vencido | expirada" assinatura.txt
          grep -q "Este link venceu. Peça um novo à ótica." assinatura.txt
      - name: Teste dos planos (Essencial, notas avulsas, Especial)
        run: |
          psql -q -f supabase/tests/planos_smoke.sql 2>&1 | tee planos.txt
          grep -q "precos | plano_especial=100.00+nota_fiscal | nota_fiscal=a definir | multiloja=49.00" planos.txt
          grep -q "liberado | avulso:notas=true,pdv=false,clientes=true | especial:notas=true,pdv=true,clientes=true | essencial:notas=false,pdv=false,clientes=true" planos.txt
          grep -q "especial entrada pela nota | 2" planos.txt
          grep -q "especial abre caixa | t" planos.txt
          grep -q "avulso entrada pela nota | 1" planos.txt
          test "$(grep -c 'O PDV e o caixa fazem parte do Plano Especial' planos.txt)" = 2
          grep -q "A entrada pela nota do fornecedor faz parte do Plano Especial" planos.txt
      - name: Teste do caixa (receber óculos e crediário, devolução, resumo e fechamento)
        run: |
          psql -q -f supabase/tests/caixa_smoke.sql 2>&1 | tee caixa.txt
          grep -q "pendencias | oculos:Marta Souza:500.00" caixa.txt
          grep -q "pelo telefone | *1" caixa.txt
          grep -q "sinal no caixa cria OS | t" caixa.txt
          grep -q "passa do que falta pagar (R\$ 300.00)" caixa.txt
          grep -q "pendencias depois | *0" caixa.txt
          grep -q "parcela no caixa | t" caixa.txt
          grep -q "parcelas abertas | 70.00" caixa.txt
          grep -q "Só o gerente faz devolução" caixa.txt
          grep -q "devolve estojo | 45.00" caixa.txt
          grep -q "crediario aberto | 25.00" caixa.txt
          grep -q "devolve sol | 180.00" caixa.txt
          grep -q 'Quantidade inválida para "Óculos de sol": pode devolver até 0' caixa.txt
          grep -q "estoque | Estojo=9,Óculos de sol=5" caixa.txt
          grep -q "comissao da venda | 45.00/4.50" caixa.txt
          grep -q 'resumo | {"dinheiro": 100.00} | {"pix": 300.00, "dinheiro": 300.00} | 180.00 *| 320.00' caixa.txt
          grep -q "fechamento | 0.00" caixa.txt
          grep -q "OS e funil | *1 | ganha | *2" caixa.txt
          grep -q "caixa le atendimentos (esperado 0) | *0" caixa.txt
          grep -q "permission denied for function pendencias_para_receber" caixa.txt
          test "$(grep -c "O orçamento já tem pagamento e não muda mais" caixa.txt)" = 2
          grep -q "orcamento travado | *1 | 500.00" caixa.txt
      # depois de todos os outros: usa os usuários e dados que eles criaram
      - name: Teste de segurança (regra das tabelas, o que o público alcança, varredura entre óticas)
        run: |
          psql -q -f supabase/tests/seguranca_smoke.sql 2>&1 | tee seguranca.txt
          test "$(grep -c '| nenhum$' seguranca.txt)" = 8
          grep -q "usuarios varridos | t *| t" seguranca.txt
          grep -q "tabelas varridas | t" seguranca.txt
          grep -q "funcao nova | f *| t" seguranca.txt
      - name: Consultas das telas batem com o banco (tabelas, colunas, relações, rpc)
        run: |
          npm ci
          node supabase/tests/conferir_consultas.mjs
      - name: Tipos do banco em dia (src/lib/supabase/tipos.ts)
        run: node supabase/gerar_tipos.mjs --conferir
      # por último: cria as tabelas de login de exemplo no banco de teste
      - name: Backup e restauração (restaurado igual ao original, com as permissões)
        run: supabase/tests/backup_teste.sh

  fotos:
    name: Backup das fotos (S3 falso)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o S3 falso (moto)
        run: pipx install "moto[server]"
      - name: Backup e restauração das fotos
        run: supabase/tests/backup_fotos_teste.sh

  carga:
    name: Desempenho com 1.000 óticas (limite de 50 ms por tela)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Banco com as migrações e 1.000 óticas
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/stub_supabase.sql
          for m in supabase/migrations/0*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$m" > /dev/null; done
          psql -v ON_ERROR_STOP=1 -q -f supabase/carga/gerar_dados.sql
      - name: Medir as telas
        run: |
          psql -q -f supabase/carga/medir.sql 2>&1 | tee medidas.txt
          grep -q "telas acima de 50 ms | nenhuma *| *18" medidas.txt

  e2e:
    name: Telas de ponta a ponta (Supabase local + navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: npm ci
      - name: Subir o Supabase local (aplica as migrações)
        run: supabase start -x studio,imgproxy,inbucket,mailpit,edge-runtime,logflare,vector,postgres-meta,supavisor
      - name: Chaves do Supabase local
        run: |
          supabase status -o json > /tmp/status.json
          node -e '
            const s = require("/tmp/status.json");
            const linhas = [
              "NEXT_PUBLIC_SUPABASE_URL=" + s.API_URL,
              "NEXT_PUBLIC_SUPABASE_ANON_KEY=" + (s.ANON_KEY || s.PUBLISHABLE_KEY),
              "SUPABASE_SERVICE_ROLE_KEY=" + (s.SERVICE_ROLE_KEY || s.SECRET_KEY),
            ];
            require("fs").appendFileSync(process.env.GITHUB_ENV, linhas.join("\n") + "\n");'
      - name: Ótica de teste (logins, produtos, Plano Especial)
        run: node e2e/preparar.mjs
      - name: Compilar e subir o Vitral
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build
          nohup npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
      - name: Teste das telas
        env:
          PW_CANAL: chrome # Google Chrome que já vem na máquina do GitHub
        run: |
          google-chrome --version
          npx playwright test
      - name: Registro do servidor do Vitral (quando falha)
        if: failure()
        run: tail -n 150 next.log || true
      - name: Relatório (fotos e rastros das falhas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-telas
          path: |
            playwright-report/
            test-results/
            next.log
          retention-days: 14
          if-no-files-found: ignore

  web:
    name: Aplicativo (tipos e build)
    runs-on: ubuntu-latest
    env:
      # chaves falsas: o build não fala com o Supabase, só precisa que existam
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-falsa
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
